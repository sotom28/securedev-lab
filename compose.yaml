name: securedev-estudiante

services:
  app:
    build: .
    environment:
      DATABASE_PATH: /data/securedev.db
      SECRET_KEY: clave-insegura-solo-laboratorio
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:8000:8000"

  # Fuente de datos interna de Grafana: lee /metrics de la app. No expone puertos.
  prometheus:
    build: ./monitoring/prometheus
    depends_on:
      - app
    volumes:
      - prometheus_data:/prometheus

  # Monitorización del entorno: http://localhost:3000
  grafana:
    build: ./monitoring/grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: securedev-grafana-lab
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  app_data:
  prometheus_data:
  grafana_data:
