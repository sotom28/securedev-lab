name: securedev-estudiante

services:
  # Paso único al arrancar: deja el volumen de datos con el dueño correcto (usuario 10001),
  # porque la app ya no corre como root. Termina y no queda en ejecución.
  app-init:
    build: .
    user: "0"
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - app_data:/data
    restart: "no"

  app:
    build: .
    depends_on:
      app-init:
        condition: service_completed_successfully
    environment:
      DATABASE_PATH: /data/securedev.db
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en el archivo .env (ver .env.example)}
      METRICS_TOKEN: ${METRICS_TOKEN:?Defina METRICS_TOKEN en el archivo .env (ver .env.example)}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:8000:8000"

  # Fuente de datos interna de Grafana: lee /metrics de la app. No expone puertos.
  prometheus:
    build: ./monitoring/prometheus
    depends_on:
      - app
    # El token llega como archivo desde la variable de entorno (sin bind mounts ni secretos en la imagen).
    configs:
      - source: metrics_token
        target: /etc/prometheus/metrics_token
    volumes:
      - prometheus_data:/prometheus

  # Monitorización del entorno: http://localhost:3000
  grafana:
    build: ./monitoring/grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: securedev-grafana-lab
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

configs:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  app_data:
  prometheus_data:
  grafana_data:
